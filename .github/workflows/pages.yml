name: Deploy CodexPulse

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Checkout encrypted snapshot
        id: snapshot
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: data
          path: .codexpulse-data
          persist-credentials: false

      - name: Add encrypted snapshot to the app
        if: steps.snapshot.outcome == 'success'
        run: cp .codexpulse-data/codexpulse-data.enc.json public/codexpulse-data.enc.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: Lint application
        run: npm run lint

      - name: Build static app
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/codexpulse

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
